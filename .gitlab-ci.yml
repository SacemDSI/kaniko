include:
  - component: $CI_SERVER_FQDN/dsi/plateforme/usine-logicielle/usilo-ci-cd-catalog/docker/gitlab-ci-docker@v1.1.4
    inputs:
      docker_build_context: "${CI_PROJECT_DIR}/"
      dockerfile: "deploy/Dockerfile"
      docker_registry_host: "artifactory.prusilo.interne.cloud.sacem.fr"
      docker_registry_username: "$USILO_USILO_ARTEFACT_REPOSITORY_USERNAME"
      docker_registry_password: "$USILO_USILO_ARTEFACT_REPOSITORY_PASSWORD"
      docker_build_image: "artifactory.prusilo.interne.cloud.sacem.fr/oci/executor:v0.0.1-debug"

default:
  tags:
    - onprem

variables:
  KANIKO_VERSION: v1.25.16
  OCI_REGISTRY_HOST: artifactory.prusilo.interne.cloud.sacem.fr
  OCI_SANDBOX_BASE: dsi-train-plt-usine-logicielle-oci-sandbox
  OCI_PUBLISH_BASE: dsi-train-plt-usine-logicielle-oci

stages:
  - lint
  - check
  - build
  - verify
  - publish

.image-matrix: &image-matrix
  - VARIANT: warmer
    TARGET: kaniko-warmer
    IMAGE_REPO_PATH: warmer
    IMAGE_TAG: "${KANIKO_VERSION}-sandbox"
    PUBLISH_TAG: "$KANIKO_VERSION"
  - VARIANT: executor
    TARGET: kaniko-executor
    IMAGE_REPO_PATH: executor
    IMAGE_TAG: "${KANIKO_VERSION}-sandbox"
    PUBLISH_TAG: "$KANIKO_VERSION"
  - VARIANT: debug
    TARGET: kaniko-debug
    IMAGE_REPO_PATH: executor
    IMAGE_TAG: "${KANIKO_VERSION}-debug-sandbox"
    PUBLISH_TAG: "${KANIKO_VERSION}-debug"
  - VARIANT: slim
    TARGET: kaniko-slim
    IMAGE_REPO_PATH: executor
    IMAGE_TAG: "${KANIKO_VERSION}-slim-sandbox"
    PUBLISH_TAG: "${KANIKO_VERSION}-slim"

lint-dockerfile:
  extends: .docker-hadolint
  allow_failure: true

check-snapshot:
  extends: .skopeo-inspect
  stage: check
  parallel:
    matrix: *image-matrix
  variables:
    DOCKER_BUILD_IMAGE_SNAPSHOT: "${OCI_REGISTRY_HOST}/${OCI_SANDBOX_BASE}/${IMAGE_REPO_PATH}:${IMAGE_TAG}"

build-image:
  extends: .docker-build
  stage: build
  parallel:
    matrix: *image-matrix
  variables:
    DOCKER_BUILD_IMAGE_SNAPSHOT: "${OCI_REGISTRY_HOST}/${OCI_SANDBOX_BASE}/${IMAGE_REPO_PATH}:${IMAGE_TAG}"
    DOCKER_BUILD_OPTIONS: "--target=${TARGET} --compressed-caching=false --snapshot-mode=redo"
  needs:
    - job: check-snapshot
      parallel:
        matrix: *image-matrix

verify-image-contents:
  extends: .skopeo-inspect
  stage: verify
  parallel:
    matrix: *image-matrix
  needs:
    - job: build-image
      parallel:
        matrix: *image-matrix
  variables:
    DOCKER_BUILD_IMAGE_SNAPSHOT: "${OCI_REGISTRY_HOST}/${OCI_SANDBOX_BASE}/${IMAGE_REPO_PATH}:${IMAGE_TAG}"
  script:
    - echo "Verifying image content for ${DOCKER_BUILD_IMAGE_SNAPSHOT}"
    - |
      if [ -n "$USILO_USILO_ARTEFACT_REPOSITORY_USERNAME" ] && [ -n "$USILO_USILO_ARTEFACT_REPOSITORY_PASSWORD" ]; then
        AUTH_B64=$(echo -n "$USILO_USILO_ARTEFACT_REPOSITORY_USERNAME:$USILO_USILO_ARTEFACT_REPOSITORY_PASSWORD" | base64 -w 0)
        echo "{\"auths\": {\"$OCI_REGISTRY_HOST\": {\"auth\": \"$AUTH_B64\"}}}" > /tmp/auth.json
        SKOPEO_AUTH_ARGS="--authfile /tmp/auth.json"
      else
        echo "Warning: registry credentials not available, continuing without explicit authfile"
        SKOPEO_AUTH_ARGS=""
      fi
      echo "VARIANT=${VARIANT} TARGET=${TARGET} IMAGE_TAG=${IMAGE_TAG}"
      SRC="docker://${DOCKER_BUILD_IMAGE_SNAPSHOT}"
      echo "Inspecting remote image before copy: $SRC"
      skopeo inspect $SKOPEO_AUTH_ARGS "$SRC" || true
      skopeo inspect --raw $SKOPEO_AUTH_ARGS "$SRC" | grep -E '"digest"|"mediaType"|"architecture"|"os"|"RepoTags"' | head -n 40 || true
      mkdir -p verify
      skopeo copy $SKOPEO_AUTH_ARGS "$SRC" oci:verify
      if [ ! -d verify/blobs/sha256 ]; then
        echo "OCI layout blobs not found"
        find verify -maxdepth 3 -type f | sort
        exit 1
      fi
      WANT_EXECUTOR=0
      WANT_WARMER=0
      if [ "${VARIANT}" = "executor" ] || [ "${VARIANT}" = "debug" ] || [ "${VARIANT}" = "slim" ]; then
        WANT_EXECUTOR=1
      fi
      if [ "${VARIANT}" = "warmer" ] || [ "${VARIANT}" = "debug" ]; then
        WANT_WARMER=1
      fi
      found_executor=0
      found_warmer=0
      while IFS= read -r blob; do
        if [ -z "$blob" ]; then
          continue
        fi
        if tar -tf "$blob" 2>/dev/null | grep -q 'kaniko/executor'; then
          found_executor=1
        fi
        if tar -tf "$blob" 2>/dev/null | grep -q 'kaniko/warmer'; then
          found_warmer=1
        fi
        if [ "$found_executor" -eq 1 ] && [ "$found_warmer" -eq 1 ]; then
          break
        fi
      done < <(find verify/blobs/sha256 -type f | sort)

      if [ "$WANT_EXECUTOR" -eq 1 ] && [ "$found_executor" -ne 1 ]; then
        echo "searched blobs:"
        find verify/blobs/sha256 -type f | sort
        while IFS= read -r blob; do
          echo "blob=$blob"
          tar -tf "$blob" 2>/dev/null | grep -E 'kaniko/(executor|warmer)' || true
        done < <(find verify/blobs/sha256 -type f | sort)
        echo "/kaniko/executor not found in ${DOCKER_BUILD_IMAGE_SNAPSHOT}"
        exit 1
      fi
      if [ "$WANT_WARMER" -eq 1 ] && [ "$found_warmer" -ne 1 ]; then
        echo "/kaniko/warmer not found in ${DOCKER_BUILD_IMAGE_SNAPSHOT}"
        exit 1
      fi
      echo "verification passed"

publish-image:
  extends: .skopeo-copy
  stage: publish
  parallel:
    matrix: *image-matrix
  variables:
    DOCKER_SRC_IMAGE: "${OCI_REGISTRY_HOST}/${OCI_SANDBOX_BASE}/${IMAGE_REPO_PATH}:${IMAGE_TAG}"
    DOCKER_DEST_IMAGE: "${OCI_REGISTRY_HOST}/${OCI_PUBLISH_BASE}/${IMAGE_REPO_PATH}:${PUBLISH_TAG}"
  needs:
    - job: build-image
      parallel:
        matrix: *image-matrix
  rules:
    - when: never