name: Build images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prd
      confirm_deployment:
        description: 'Type "DEPLOY" to confirm'
        required: true
        type: string
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
      - 'feature/*'

permissions: {}

jobs:
  build-images:
    concurrency:
      # If a previous run is ongoing with the same head_ref (it's a run on the
      # same PR) then cancel it to save time. If it isn't a PR, only cancel the
      # previous run if it's on the same commit SHA. This prevents a run for a
      # commit push from cancelling a previous commit push's build, since we
      # want an image built and tagged for each commit.
      group: build-images-${{ matrix.image }}-${{ github.head_ref || github.sha }}
      cancel-in-progress: true

    permissions:
      contents: read  # Read the repo contents.
      packages: write  # Write to GitHub Packages (for pushing images).

    runs-on: sacem
    environment:
      name: ${{ (github.ref_name == 'main' || github.ref_type == 'tag') && 'PRD' || 'DEV' }}
    env:
      ARTIFACTORY_REGISTRY: ${{ secrets.ARTIFACTORY_REGISTRY }}
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        image:
          # - executor
          - executor-debug
          # - executor-slim
          # - warmer

        include:
          # - image: executor
          #   target: kaniko-executor
          #   platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          #   image-name: ghcr.io/sacemdsi/kaniko/executor
          #   tagSuffix: ""
          #   release-tag: latest

          - image: executor-debug
            target: kaniko-debug
            platforms: linux/amd64,linux/arm64,linux/s390x
            image-name: executor
            tagSuffix: -debug
            release-tag: debug

          # - image: executor-slim
          #   target: kaniko-slim
          #   platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          #   image-name: ghcr.io/sacemdsi/kaniko/executor
          #   tagSuffix: -slim
          #   release-tag: slim

          # - image: warmer
          #   target: kaniko-warmer
          #   platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          #   image-name: ghcr.io/sacemdsi/kaniko/warmer
          #   tagSuffix: ""
          #   release-tag: latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Don't build for all platforms on PRs.
      - id: platforms
        run: |
          event="${{ github.event_name }}"
          if [[ "$event" == "pull_request" ]]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            platforms="${{ matrix.platforms }}"
            echo "platforms=${platforms}" >> $GITHUB_OUTPUT
          fi
      # Build and push with Docker.
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: ${{ matrix.platforms }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
###### AJOUT #######
      - name: Compute version tag
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Released tag (e.g. v1.25.16): use it as-is, no -dev suffix.
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "dev-suffix=" >> "$GITHUB_OUTPUT"
          else
            branch="${{ github.head_ref || github.ref_name }}"
            # Docker tags can't contain '/', so sanitize the branch name.
            echo "version=${branch//\//-}" >> "$GITHUB_OUTPUT"
            echo "dev-suffix=-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute push tags (GHCR + optional Artifactory)
        id: compute-tags
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACTORY_REGISTRY" ]; then
            echo "ARTIFACTORY_REGISTRY must be set to push images" >&2
            exit 1
          fi
          name_part="${{ matrix.image-name }}"
          image_path="${name_part#ghcr.io/}"
          image_tag="${{ steps.version.outputs.version }}${{ matrix.tagSuffix }}${{ steps.version.outputs.dev-suffix }}"
          art_tag="$ARTIFACTORY_REGISTRY/$image_path:${image_tag}"
          tags="$art_tag"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Login to Artifactory (if configured)
        if: ${{ env.ARTIFACTORY_REGISTRY != '' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ARTIFACTORY_REGISTRY }}
          username: ${{ env.ARTIFACTORY_USERNAME }}
          password: ${{ env.ARTIFACTORY_PASSWORD }}
###### FIN AJOUT #######
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build-and-push
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.compute-tags.outputs.tags }}
          no-cache-filters: certs
          # https://github.com/docker/build-push-action/blob/master/docs/advanced/cache.md#github-cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: ${{ matrix.target }}
